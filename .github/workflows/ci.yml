name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests scripts
      - name: Train and check quality gate
        run: PYTHONPATH=src python -m mlpipe.train
      - name: Tests
        run: pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mlops-mini-pipeline:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8000:8000 mlops-mini-pipeline:ci
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          curl -sf -X POST http://127.0.0.1:8000/predict -H 'Content-Type: application/json' \
            -d '{"instances": [[13.2,1.78,2.14,11.2,100,2.65,2.76,0.26,1.28,4.38,1.05,3.4,1050]]}'
          docker rm -f api
